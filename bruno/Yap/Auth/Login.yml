info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{api}}/auth/login"
  body:
    type: form-urlencoded
    data:
      - name: username
        value: ""
      - name: email
        value: ""
        disabled: true
      - name: password
        value: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
