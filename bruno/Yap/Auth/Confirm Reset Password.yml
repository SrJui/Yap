info:
  name: Confirm Reset Password
  type: http
  seq: 7

http:
  method: POST
  url: "{{api}}/auth/password-reset/confirm"
  body:
    type: form-urlencoded
    data:
      - name: token
        value: ""
      - name: newPassword
        value: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
