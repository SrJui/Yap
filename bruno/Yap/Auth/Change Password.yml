info:
  name: Change Password
  type: http
  seq: 4

http:
  method: PUT
  url: "{{api}}/auth/password/:id"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: form-urlencoded
    data:
      - name: password
        value: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
