info:
  name: Change Password
  type: http
  seq: 5

http:
  method: PUT
  url: "{{api}}/password-change"
  body:
    type: form-urlencoded
    data:
      - name: password
        value: ""
      - name: new_password
        value: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
